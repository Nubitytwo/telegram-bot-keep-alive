
name: Keep Bot Alive
on:
  schedule:
    # Запуск каждые 15 минут (оптимальное время по тестам)
    - cron: '*/15 * * * *'
  # Разрешить ручной запуск из интерфейса GitHub
  workflow_dispatch:

jobs:
  ping-telegram-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Telegram Bot API
        run: |
          echo "🤖 Активация Telegram Bot через API..."

          # Проверяем статус бота (основной пинг)
          BOT_RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe")
          echo "✅ getMe response received"

          # Получаем обновления (имитируем активность polling)
          UPDATES_RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates?limit=1&timeout=2")
          echo "✅ getUpdates response received"

          echo "🎯 Telegram Bot API активирован успешно"

      - name: Log completion
        run: |
          echo "🕐 Пинг завершен в $(date)"
          echo "⏰ Следующий пинг через 15 минут"
          echo "📊 Используется минимальная нагрузка на GitHub Actions"
